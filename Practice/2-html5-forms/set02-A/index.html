<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Conference Registration Form</title>
</head>
<body>
  <h1>Tech Conference Registration</h1>
  <form>
    <fieldset>
      <legend>Personal Details</legend>
      <label>Email <input type="email" required></label><br>
      <label>Phone <input type="tel" pattern="[0-9]{10}" required></label><br>
      <label>Website <input type="url"></label><br>
      <label>DOB <input type="date"></label>
    </fieldset>
    <fieldset>
      <legend>Conference</legend>
      <label>Tickets <input type="number" min="1" max="5"></label><br>
      <label>Experience <input type="range" min="0" max="10"></label><br>
      <label>Track <input list="tracks"></label>
      <datalist id="tracks"><option value="Web"><option value="AI"></datalist>
    </fieldset>
    <button>Register</button>
  </form>
</body>
</html>
