<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center;
         padding: .5rem; border-bottom: 1px solid #ddd; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #888; }
    .filters button.active { font-weight: bold; background: #cde; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <input type="text" id="taskInput" placeholder="Enter a task">
  <button id="addBtn">Add</button>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="pending">Pending</button>
    <button data-filter="completed">Completed</button>
  </div>

  <ul id="list"></ul>

  <script>
    const input = document.getElementById('taskInput');
    const list = document.getElementById('list');
    let filter = 'all';

    function addTask() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = text;
      li.appendChild(span);

      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.addEventListener('click', e => { e.stopPropagation(); li.remove(); });
      li.appendChild(del);

      li.addEventListener('click', () => { li.classList.toggle('done'); applyFilter(); });

      list.appendChild(li);
      input.value = '';
      applyFilter();
    }

    function applyFilter() {
      list.querySelectorAll('li').forEach(li => {
        const done = li.classList.contains('done');
        li.style.display =
          filter === 'all' || (filter === 'completed' && done) || (filter === 'pending' && !done)
            ? 'flex' : 'none';
      });
    }

    document.getElementById('addBtn').addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    document.querySelectorAll('.filters button').forEach(btn =>
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.filter;
        applyFilter();
      }));
  </script>
</body>
</html>
