<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q13A - Music &amp; Cultural Festival</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #1a1033;
        color: #f5f3ff;
        line-height: 1.6;
      }
      header {
        background: linear-gradient(135deg, #7c3aed, #db2777);
        text-align: center;
        padding: 3rem 1rem;
      }
      header h1 {
        margin: 0;
        font-size: 2.5rem;
      }
      main {
        max-width: 850px;
        margin: 0 auto;
        padding: 1rem;
      }
      h2 {
        color: #f0abfc;
      }
      .artists {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }
      .artist {
        background: #2e1a5e;
        padding: 1rem;
        border-radius: 10px;
      }
      audio,
      video {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #2e1a5e;
      }
      th {
        background: #7c3aed;
      }
      th,
      td {
        padding: 0.7rem;
        text-align: left;
        border-bottom: 1px solid #4c2e91;
      }
      a {
        color: #f9a8d4;
      }
      ul {
        display: flex;
        gap: 1.5rem;
        list-style: none;
        padding: 0;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SoundWave Festival 2026</h1>
      <p>3 days. 20 artists. One unforgettable weekend.</p>
    </header>
    <main>
      <h2>Artist Previews</h2>
      <div class="artists">
        <div class="artist">
          <h3>Luna Ray</h3>
          <audio controls src="https://www.w3schools.com/html/horse.mp3"></audio>
        </div>
        <div class="artist">
          <h3>The Echoes</h3>
          <audio controls src="https://www.w3schools.com/html/horse.mp3"></audio>
        </div>
      </div>
      <h2>Trailer</h2>
      <video controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
      <h2>Daily Schedule</h2>
      <table>
        <tr>
          <th>Day</th>
          <th>Time</th>
          <th>Artist</th>
          <th>Stage</th>
        </tr>
        <tr>
          <td>Fri</td>
          <td>6:00 PM</td>
          <td>Luna Ray</td>
          <td>Main</td>
        </tr>
        <tr>
          <td>Sat</td>
          <td>8:00 PM</td>
          <td>The Echoes</td>
          <td>Main</td>
        </tr>
        <tr>
          <td>Sun</td>
          <td>7:00 PM</td>
          <td>DJ Nova</td>
          <td>Sunset</td>
        </tr>
      </table>
      <h2>Sponsors</h2>
      <ul>
        <li><a href="https://example.com" target="_blank" rel="noopener">Sponsor One</a></li>
        <li><a href="https://example.org" target="_blank" rel="noopener">Sponsor Two</a></li>
      </ul>
    </main>
  </body>
</html>
