<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q18A - Photography Gallery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #0a0a0a;
        color: #fff;
        padding: 2rem 1rem;
      }
      h1 {
        text-align: center;
        font-weight: 300;
        letter-spacing: 0.2em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        max-width: 1100px;
        margin: 2rem auto;
      }
      .item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        aspect-ratio: 4/3;
      }
      .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s;
        display: block;
      }
      .item:hover img {
        transform: scale(1.15);
      }
      .item span {
        position: absolute;
        inset: auto 0 0 0;
        padding: 1rem;
        background: linear-gradient(transparent, #000c);
        opacity: 0;
        transform: translateY(100%);
        transition: 0.3s;
      }
      .item:hover span {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 500px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>FRAMES</h1>
    <div class="grid">
      <div class="item">
        <img src="https://picsum.photos/seed/g1/400/300" alt="Mountains" />
        <span>Mountains</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g2/400/300" alt="City" />
        <span>City Lights</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g3/400/300" alt="Forest" />
        <span>Forest Walk</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g4/400/300" alt="Beach" />
        <span>Golden Beach</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g5/400/300" alt="Desert" />
        <span>Desert Dunes</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g6/400/300" alt="Lake" />
        <span>Calm Lake</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g7/400/300" alt="Street" />
        <span>Old Street</span>
      </div>
      <div class="item">
        <img src="https://picsum.photos/seed/g8/400/300" alt="Sunset" />
        <span>Sunset</span>
      </div>
    </div>
  </body>
</html>
