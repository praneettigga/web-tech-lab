<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q8B - Currency Converter</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #0f766e, #0ea5e9);
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      .box {
        width: 100%;
        max-width: 400px;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 12px 32px #0003;
      }
      h1 {
        margin-top: 0;
        color: #0f766e;
      }
      label {
        display: block;
        margin: 0.8rem 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
      }
      input,
      select {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus,
      select:focus {
        outline: 2px solid #14b8a6;
        border-color: transparent;
      }
      #result {
        margin-top: 1.2rem;
        padding: 1rem;
        background: #ccfbf1;
        border-radius: 10px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 700;
        color: #115e59;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Currency Converter</h1>
      <label>Amount (USD)</label>
      <input type="number" id="amt" value="1" min="0" />
      <label>Convert to</label>
      <select id="cur">
        <option>INR</option>
        <option>EUR</option>
        <option>GBP</option>
        <option>JPY</option>
      </select>
      <div id="result"></div>
    </div>
    <script>
      const rates = { INR: 83.2, EUR: 0.92, GBP: 0.79, JPY: 149.5 };
      const amt = document.getElementById("amt"),
        cur = document.getElementById("cur"),
        out = document.getElementById("result");
      function convert() {
        const a = parseFloat(amt.value);
        out.textContent =
          isNaN(a) || a < 0
            ? "Enter a valid amount"
            : `${a} USD = ${(a * rates[cur.value]).toFixed(2)} ${cur.value}`;
      }
      amt.addEventListener("keyup", convert);
      cur.addEventListener("change", convert);
      convert();
    </script>
  </body>
</html>
