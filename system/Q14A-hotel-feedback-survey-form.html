<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q14A - Hotel Feedback Survey</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #fdf2f8;
        margin: 0;
        padding: 2rem 1rem;
      }
      form {
        max-width: 520px;
        margin: auto;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 14px;
        box-shadow: 0 8px 24px #0002;
      }
      h1 {
        margin-top: 0;
        color: #be185d;
      }
      label.t {
        display: block;
        margin: 0.8rem 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
      }
      input:not([type="radio"]):not([type="color"]),
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input[type="color"] {
        width: 60px;
        height: 36px;
        border: 0;
        padding: 0;
      }
      input:focus {
        outline: 2px solid #ec4899;
        border-color: transparent;
      }
      .row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .btns {
        display: flex;
        gap: 1rem;
        margin-top: 1.2rem;
      }
      button {
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      button[type="submit"] {
        background: #db2777;
        color: #fff;
      }
      button[type="reset"] {
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <form>
      <h1>How was your stay?</h1>
      <label class="t">Name</label>
      <input required />
      <label class="t">Social profile</label>
      <input type="url" placeholder="https://..." />
      <label class="t">City</label>
      <input list="cities" placeholder="Your city" />
      <datalist id="cities">
        <option>Mumbai</option>
        <option>Delhi</option>
        <option>Bengaluru</option>
        <option>Kolkata</option>
        <option>Chennai</option>
      </datalist>
      <label class="t">Pick a colour that matches your mood</label>
      <input type="color" value="#ec4899" />
      <label class="t">Rating</label>
      <div class="row">
        <label>
          <input type="radio" name="r" required />
          1
        </label>
        <label>
          <input type="radio" name="r" />
          2
        </label>
        <label>
          <input type="radio" name="r" />
          3
        </label>
        <label>
          <input type="radio" name="r" />
          4
        </label>
        <label>
          <input type="radio" name="r" />
          5
        </label>
      </div>
      <div class="btns">
        <button type="reset">Clear</button>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
