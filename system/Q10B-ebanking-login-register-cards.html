<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q10B - E-Banking Login</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #e0f2fe;
        color: #0f172a;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        background: #075985;
        color: #fff;
        padding: 0.9rem 2rem;
        flex-wrap: wrap;
      }
      nav .logo {
        font-weight: 800;
        font-size: 1.3rem;
        margin-right: auto;
      }
      nav a {
        color: #bae6fd;
        text-decoration: none;
        transition: 0.2s;
      }
      nav a:hover {
        color: #fff;
      }
      .cards {
        display: flex;
        gap: 2rem;
        max-width: 850px;
        margin: 3rem auto;
        padding: 0 1rem;
        flex-wrap: wrap;
      }
      .card {
        flex: 1;
        min-width: 280px;
        background: #fff;
        padding: 1.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px #0002;
        transition: 0.3s;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 16px 40px #0003;
      }
      h2 {
        margin-top: 0;
        color: #075985;
      }
      .field {
        position: relative;
        margin-bottom: 1rem;
      }
      .field span {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
      }
      .field input {
        width: 100%;
        padding: 0.75rem 0.75rem 0.75rem 2.5rem;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 1rem;
        transition: 0.2s;
      }
      .field input:hover {
        border-color: #38bdf8;
      }
      .field input:focus {
        outline: none;
        border-color: #0284c7;
        box-shadow: 0 0 0 3px #bae6fd;
      }
      button {
        width: 100%;
        padding: 0.8rem;
        border: 0;
        border-radius: 10px;
        background: #0284c7;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background: #075985;
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="logo">&#127974; SecureBank</span>
      <a href="#">Security</a>
      <a href="#">Fraud Alerts</a>
      <a href="#">Help Desk: 1800-123-456</a>
    </nav>
    <div class="cards">
      <form class="card">
        <h2>Sign In</h2>
        <div class="field">
          <span>&#128100;</span>
          <input placeholder="Customer ID" required />
        </div>
        <div class="field">
          <span>&#128274;</span>
          <input type="password" placeholder="Password" required />
        </div>
        <button>Login</button>
      </form>
      <form class="card">
        <h2>Register</h2>
        <div class="field">
          <span>&#128100;</span>
          <input placeholder="Full name" required />
        </div>
        <div class="field">
          <span>&#9993;</span>
          <input type="email" placeholder="Email" required />
        </div>
        <div class="field">
          <span>&#128274;</span>
          <input type="password" placeholder="Create password" required />
        </div>
        <button>Create Account</button>
      </form>
    </div>
    <script>
      document.querySelectorAll("form").forEach((f) => (f.onsubmit = (e) => e.preventDefault()));
    </script>
  </body>
</html>
