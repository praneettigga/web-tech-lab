<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q4A - Fine Dining Restaurant</title>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: Georgia, serif;
        margin: 0;
        background: #faf7f2;
        color: #2b2118;
        line-height: 1.6;
      }
      .banner {
        background:
          linear-gradient(#0008, #0008),
          url(https://picsum.photos/seed/dining/1200/400) center/cover;
        color: #fff;
        text-align: center;
        padding: 4rem 1rem;
      }
      .banner h1 {
        margin: 0;
        font-size: 2.5rem;
        letter-spacing: 0.1em;
      }
      nav {
        position: sticky;
        top: 0;
        background: #2b2118;
        text-align: center;
        padding: 0.8rem;
      }
      nav a {
        color: #e8d5b5;
        margin: 0 1rem;
        text-decoration: none;
      }
      nav a:hover {
        color: #fff;
      }
      section {
        max-width: 900px;
        margin: 0 auto;
        padding: 2.5rem 1rem;
      }
      h2 {
        border-bottom: 2px solid #b8860b;
        display: inline-block;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .gallery figure {
        margin: 0;
      }
      .gallery img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
      }
      figcaption {
        text-align: center;
        font-style: italic;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th {
        background: #b8860b;
        color: #fff;
      }
      th,
      td {
        padding: 0.7rem;
        border-bottom: 1px solid #eee;
        text-align: left;
      }
      video,
      audio {
        width: 100%;
        max-width: 560px;
        display: block;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <h1>LA MAISON</h1>
      <p>Fine dining since 1998</p>
    </div>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#menu">Menu</a>
      <a href="#media">Media</a>
    </nav>
    <section id="gallery">
      <h2>Signature Dishes</h2>
      <div class="gallery">
        <figure>
          <img src="https://picsum.photos/seed/dish1/300/200" alt="Truffle risotto" />
          <figcaption>Truffle Risotto</figcaption>
        </figure>
        <figure>
          <img src="https://picsum.photos/seed/dish2/300/200" alt="Seared scallops" />
          <figcaption>Seared Scallops</figcaption>
        </figure>
        <figure>
          <img src="https://picsum.photos/seed/dish3/300/200" alt="Duck confit" />
          <figcaption>Duck Confit</figcaption>
        </figure>
        <figure>
          <img src="https://picsum.photos/seed/dish4/300/200" alt="Chocolate fondant" />
          <figcaption>Chocolate Fondant</figcaption>
        </figure>
      </div>
    </section>
    <section id="menu">
      <h2>Multi-Course Menu</h2>
      <table>
        <tr>
          <th>Course</th>
          <th>Dish</th>
          <th>Price</th>
        </tr>
        <tr>
          <td>Starter</td>
          <td>Seared Scallops</td>
          <td>$18</td>
        </tr>
        <tr>
          <td>Soup</td>
          <td>Lobster Bisque</td>
          <td>$14</td>
        </tr>
        <tr>
          <td>Main</td>
          <td>Duck Confit</td>
          <td>$34</td>
        </tr>
        <tr>
          <td>Dessert</td>
          <td>Chocolate Fondant</td>
          <td>$12</td>
        </tr>
      </table>
    </section>
    <section id="media">
      <h2>Promo</h2>
      <video controls poster="https://picsum.photos/seed/promo/560/300">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
      </video>
      <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg" />
      </audio>
    </section>
  </body>
</html>
