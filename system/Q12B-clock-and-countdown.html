<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q12B - Clock &amp; Countdown</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        text-align: center;
      }
      h2 {
        color: #94a3b8;
        font-weight: 400;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 0.9rem;
      }
      #clock {
        font-size: clamp(2.5rem, 10vw, 4.5rem);
        font-weight: 700;
        color: #38bdf8;
        font-variant-numeric: tabular-nums;
        margin-bottom: 2rem;
      }
      .cd {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .cd div {
        background: #1e293b;
        padding: 1rem 1.2rem;
        border-radius: 12px;
        min-width: 80px;
      }
      .cd b {
        display: block;
        font-size: 2rem;
        color: #f472b6;
        font-variant-numeric: tabular-nums;
      }
      .cd span {
        font-size: 0.75rem;
        color: #94a3b8;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>Current time</h2>
      <div id="clock"></div>
      <h2>Launch countdown - 1 Jan 2027</h2>
      <div class="cd">
        <div>
          <b id="d">00</b>
          <span>Days</span>
        </div>
        <div>
          <b id="h">00</b>
          <span>Hours</span>
        </div>
        <div>
          <b id="m">00</b>
          <span>Min</span>
        </div>
        <div>
          <b id="s">00</b>
          <span>Sec</span>
        </div>
      </div>
    </div>
    <script>
      const pad = (n) => String(n).padStart(2, "0"),
        $ = (id) => document.getElementById(id);
      const launch = new Date("2027-01-01T00:00:00");
      function tick() {
        const now = new Date();
        $("clock").textContent =
          `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        let diff = Math.max(0, Math.floor((launch - now) / 1000));
        $("d").textContent = pad(Math.floor(diff / 86400));
        $("h").textContent = pad(Math.floor((diff % 86400) / 3600));
        $("m").textContent = pad(Math.floor((diff % 3600) / 60));
        $("s").textContent = pad(diff % 60);
      }
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
