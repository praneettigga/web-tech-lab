<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q5B - Task Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
      }
      .box {
        max-width: 480px;
        margin: auto;
        background: #fff;
        padding: 1.5rem;
        border-radius: 16px;
        box-shadow: 0 12px 32px #0003;
      }
      h1 {
        margin-top: 0;
        color: #7c3aed;
      }
      .add {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        padding: 0.7rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid #8b5cf6;
        border-color: transparent;
      }
      button {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        padding: 0.6rem 1rem;
      }
      #add {
        background: #7c3aed;
        color: #fff;
      }
      #add:hover {
        background: #6d28d9;
      }
      .filters {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .filters button {
        flex: 1;
        background: #ede9fe;
        color: #6d28d9;
      }
      .filters button.on {
        background: #7c3aed;
        color: #fff;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.7rem;
        border-bottom: 1px solid #f3f4f6;
        cursor: pointer;
      }
      li.done span {
        text-decoration: line-through;
        color: #9ca3af;
      }
      li button {
        background: #fee2e2;
        color: #b91c1c;
        padding: 0.3rem 0.6rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Tasks</h1>
      <div class="add">
        <input id="in" placeholder="New task..." />
        <button id="add">Add</button>
      </div>
      <div class="filters">
        <button class="on" data-f="all">All</button>
        <button data-f="done">Completed</button>
        <button data-f="pending">Pending</button>
      </div>
      <ul id="list"></ul>
    </div>
    <script>
      const list = document.getElementById("list"),
        input = document.getElementById("in");
      let filter = "all";
      function add() {
        const t = input.value.trim();
        if (!t) return;
        const li = document.createElement("li");
        li.innerHTML = `<span>${t}</span><button>Delete</button>`;
        li.onclick = () => {
          li.classList.toggle("done");
          apply();
        };
        li.querySelector("button").onclick = (e) => {
          e.stopPropagation();
          li.remove();
        };
        list.appendChild(li);
        input.value = "";
        apply();
      }
      function apply() {
        [...list.children].forEach((li) => {
          const d = li.classList.contains("done");
          li.style.display =
            filter == "all" || (filter == "done" && d) || (filter == "pending" && !d) ? "" : "none";
        });
      }
      document.getElementById("add").onclick = add;
      input.onkeydown = (e) => {
        if (e.key == "Enter") add();
      };
      document.querySelectorAll(".filters button").forEach(
        (b) =>
          (b.onclick = () => {
            document.querySelector(".filters .on").classList.remove("on");
            b.classList.add("on");
            filter = b.dataset.f;
            apply();
          }),
      );
    </script>
  </body>
</html>
