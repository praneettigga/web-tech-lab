<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q20B - BMI Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      .box {
        width: 100%;
        max-width: 400px;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 12px 32px #0002;
      }
      h1 {
        margin-top: 0;
        color: #334155;
      }
      label {
        display: block;
        margin: 0.8rem 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
      }
      input {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid #64748b;
        border-color: transparent;
      }
      button {
        width: 100%;
        margin-top: 1rem;
        padding: 0.8rem;
        border: 0;
        border-radius: 8px;
        background: #334155;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1e293b;
      }
      #res {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 10px;
        text-align: center;
        font-size: 1.2rem;
        background: #e2e8f0;
        transition: background 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>BMI Calculator</h1>
      <label>Height (cm)</label>
      <input type="number" id="h" min="1" />
      <label>Weight (kg)</label>
      <input type="number" id="w" min="1" />
      <button id="go">Calculate BMI</button>
      <div id="res">Your result appears here</div>
    </div>
    <script>
      document.getElementById("go").onclick = () => {
        const h = parseFloat(document.getElementById("h").value) / 100,
          w = parseFloat(document.getElementById("w").value),
          r = document.getElementById("res");
        if (!(h > 0 && w > 0)) {
          r.style.background = "#fecaca";
          r.textContent = "Enter valid height and weight";
          return;
        }
        const bmi = w / (h * h);
        const [cat, color] =
          bmi < 18.5
            ? ["Underweight", "#93c5fd"]
            : bmi < 25
              ? ["Normal", "#86efac"]
              : bmi < 30
                ? ["Overweight", "#fde047"]
                : ["Obese", "#fca5a5"];
        r.style.background = color;
        r.innerHTML = `BMI <b>${bmi.toFixed(1)}</b><br>${cat}`;
      };
    </script>
  </body>
</html>
