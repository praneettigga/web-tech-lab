<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q9A - Pricing Page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f1f5f9;
        color: #1f2937;
        padding: 3rem 1rem;
        text-align: center;
      }
      .plans {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        max-width: 960px;
        margin: 2rem auto;
      }
      .plan {
        flex: 1;
        background: #fff;
        padding: 2rem 1.5rem;
        border-radius: 16px;
        box-shadow: 0 4px 14px #0001;
        position: relative;
      }
      .plan h3 {
        margin-top: 0;
      }
      .price {
        font-size: 2.4rem;
        font-weight: 700;
        color: #4f46e5;
      }
      .price small {
        font-size: 1rem;
        color: #6b7280;
      }
      .plan ul {
        list-style: none;
        padding: 0;
        color: #4b5563;
        line-height: 2;
      }
      .plan a {
        display: block;
        padding: 0.7rem;
        border-radius: 30px;
        background: #e0e7ff;
        color: #4338ca;
        text-decoration: none;
        font-weight: 600;
      }
      .plan a:hover {
        background: #c7d2fe;
      }
      .recommended {
        transform: scale(1.1);
        background: linear-gradient(160deg, #4f46e5, #7c3aed);
        color: #fff;
        z-index: 1;
      }
      .recommended .price,
      .recommended ul {
        color: #fff;
      }
      .recommended a {
        background: #fff;
      }
      .recommended::before {
        content: "Recommended";
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        background: #f59e0b;
        color: #fff;
        font-size: 0.75rem;
        padding: 0.2rem 0.8rem;
        border-radius: 20px;
      }
      @media (max-width: 700px) {
        .plans {
          flex-direction: column;
        }
        .plan {
          width: 100%;
        }
        .recommended {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Choose your plan</h1>
    <p>Simple pricing. Cancel anytime.</p>
    <div class="plans">
      <div class="plan">
        <h3>Basic</h3>
        <div class="price">
          $9
          <small>/mo</small>
        </div>
        <ul>
          <li>1 user</li>
          <li>5 GB storage</li>
          <li>Email support</li>
        </ul>
        <a href="#">Get Basic</a>
      </div>
      <div class="plan recommended">
        <h3>Standard</h3>
        <div class="price">
          $19
          <small>/mo</small>
        </div>
        <ul>
          <li>5 users</li>
          <li>50 GB storage</li>
          <li>Priority support</li>
        </ul>
        <a href="#">Get Standard</a>
      </div>
      <div class="plan">
        <h3>Premium</h3>
        <div class="price">
          $39
          <small>/mo</small>
        </div>
        <ul>
          <li>Unlimited users</li>
          <li>500 GB storage</li>
          <li>24/7 phone support</li>
        </ul>
        <a href="#">Get Premium</a>
      </div>
    </div>
  </body>
</html>
