<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q5A - Patient Admission Form</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #e6f4f1;
        margin: 0;
        padding: 2rem 1rem;
      }
      form {
        max-width: 560px;
        margin: auto;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 14px;
        box-shadow: 0 8px 24px #0002;
      }
      h1 {
        margin-top: 0;
        color: #0f766e;
      }
      label.t {
        display: block;
        margin: 0.8rem 0 0.2rem;
        font-size: 0.9rem;
        color: #374151;
        font-weight: 600;
      }
      input[type="text"],
      input[type="date"],
      input[type="time"],
      select,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #14b8a6;
        border-color: transparent;
      }
      .row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .row label {
        font-weight: 400;
      }
      .row input {
        margin-right: 0.3rem;
      }
      button {
        background: #0f766e;
        color: #fff;
        border: 0;
        margin-top: 1.2rem;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #115e59;
      }
    </style>
  </head>
  <body>
    <form>
      <h1>Patient Admission</h1>
      <label class="t">Patient name</label>
      <input type="text" required minlength="3" />
      <label class="t">Department</label>
      <select required>
        <option value="">-- Select --</option>
        <option>Cardiology</option>
        <option>Neurology</option>
        <option>Orthopedics</option>
        <option>Pediatrics</option>
      </select>
      <div class="row">
        <div style="flex: 1">
          <label class="t">Admission date</label>
          <input type="date" required />
        </div>
        <div style="flex: 1">
          <label class="t">Time</label>
          <input type="time" required />
        </div>
      </div>
      <label class="t">Insurance</label>
      <div class="row">
        <label>
          <input type="radio" name="ins" required />
          Insured
        </label>
        <label>
          <input type="radio" name="ins" />
          Not insured
        </label>
      </div>
      <label class="t">Existing symptoms</label>
      <div class="row">
        <label>
          <input type="checkbox" />
          Fever
        </label>
        <label>
          <input type="checkbox" />
          Cough
        </label>
        <label>
          <input type="checkbox" />
          Chest pain
        </label>
        <label>
          <input type="checkbox" />
          Headache
        </label>
      </div>
      <label class="t">Medical history</label>
      <textarea
        rows="4"
        required
        placeholder="Previous illnesses, allergies, medication..."
      ></textarea>
      <button>Admit Patient</button>
    </form>
  </body>
</html>
