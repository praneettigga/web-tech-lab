<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q14B - Real Estate Access</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f0fdf4;
        color: #14532d;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        background: #166534;
        padding: 0 2rem;
        align-items: center;
      }
      nav .logo {
        font-weight: 800;
        color: #fff;
        font-size: 1.3rem;
        margin-right: auto;
        padding: 1rem 0;
      }
      .item {
        position: relative;
      }
      .item > a {
        display: block;
        padding: 1.1rem 1rem;
        color: #bbf7d0;
        text-decoration: none;
      }
      .item:hover > a {
        color: #fff;
      }
      .menu {
        display: none;
        position: absolute;
        top: 100%;
        background: #14532d;
        min-width: 160px;
        z-index: 2;
      }
      .item:hover .menu {
        display: block;
      }
      .menu a {
        display: block;
        padding: 0.7rem 1rem;
        color: #bbf7d0;
        text-decoration: none;
        transition: 0.2s;
      }
      .menu a:hover {
        background: #22c55e;
        color: #fff;
        padding-left: 1.4rem;
      }
      .wrap {
        display: flex;
        gap: 2rem;
        justify-content: center;
        flex-wrap: wrap;
        margin: 3rem 1rem;
      }
      form {
        width: 340px;
        background: #fff;
        padding: 1.5rem;
        border-radius: 14px;
        box-shadow: 0 10px 30px #0002;
        transition: 0.3s;
      }
      form:hover {
        transform: translateY(-5px);
      }
      h2 {
        margin-top: 0;
        text-align: center;
      }
      .f {
        position: relative;
        margin-bottom: 1.2rem;
      }
      .f input {
        width: 100%;
        padding: 1rem 0.8rem 0.4rem;
        border: 2px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      .f label {
        position: absolute;
        left: 0.8rem;
        top: 50%;
        transform: translateY(-50%);
        color: #6b7280;
        pointer-events: none;
        transition: 0.2s;
      }
      .f input:focus + label,
      .f input:not(:placeholder-shown) + label {
        top: 0.7rem;
        font-size: 0.7rem;
        color: #16a34a;
      }
      .f input:focus {
        outline: none;
        border-color: #22c55e;
      }
      .eye {
        position: absolute;
        right: 0.8rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
      }
      button.go {
        width: 100%;
        padding: 0.8rem;
        border: 0;
        border-radius: 8px;
        background: #16a34a;
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.2s;
      }
      button.go:hover {
        background: #15803d;
        transform: scale(1.03);
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="logo">HomeFinder</span>
      <div class="item">
        <a href="#">Buy &#9662;</a>
        <div class="menu">
          <a href="#">Apartments</a>
          <a href="#">Villas</a>
          <a href="#">Plots</a>
        </div>
      </div>
      <div class="item">
        <a href="#">Rent &#9662;</a>
        <div class="menu">
          <a href="#">Flats</a>
          <a href="#">PG</a>
          <a href="#">Commercial</a>
        </div>
      </div>
    </nav>
    <div class="wrap">
      <form>
        <h2>Sign In</h2>
        <div class="f">
          <input type="email" placeholder=" " required />
          <label>Email</label>
        </div>
        <div class="f">
          <input type="password" placeholder=" " required />
          <label>Password</label>
          <span class="eye">&#128065;</span>
        </div>
        <button class="go">Sign In</button>
      </form>
      <form>
        <h2>Sign Up</h2>
        <div class="f">
          <input placeholder=" " required />
          <label>Full name</label>
        </div>
        <div class="f">
          <input type="email" placeholder=" " required />
          <label>Email</label>
        </div>
        <div class="f">
          <input type="password" placeholder=" " required />
          <label>Password</label>
          <span class="eye">&#128065;</span>
        </div>
        <button class="go">Create Account</button>
      </form>
    </div>
    <script>
      document.querySelectorAll(".eye").forEach(
        (e) =>
          (e.onclick = () => {
            const i = e.parentElement.querySelector("input");
            i.type = i.type == "password" ? "text" : "password";
          }),
      );
      document.querySelectorAll("form").forEach((f) => (f.onsubmit = (e) => e.preventDefault()));
    </script>
  </body>
</html>
