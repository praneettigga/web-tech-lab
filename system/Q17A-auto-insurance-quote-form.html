<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q17A - Auto Insurance Quote</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #ecfdf5;
        margin: 0;
        padding: 2rem 1rem;
      }
      form {
        max-width: 560px;
        margin: auto;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 14px;
        box-shadow: 0 8px 24px #0002;
      }
      h1 {
        margin-top: 0;
        color: #047857;
      }
      fieldset {
        border: 1px solid #a7f3d0;
        border-radius: 10px;
        margin-bottom: 1rem;
      }
      legend {
        color: #047857;
        font-weight: 600;
      }
      label.t {
        display: block;
        margin: 0.6rem 0 0.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
      }
      input:not([type="radio"]),
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid #10b981;
        border-color: transparent;
      }
      .cards {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
      }
      .cards label {
        flex: 1;
        min-width: 120px;
        border: 2px solid #d1d5db;
        border-radius: 10px;
        padding: 0.8rem;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
      }
      .cards input {
        display: none;
      }
      .cards label:has(input:checked) {
        border-color: #10b981;
        background: #d1fae5;
      }
      button {
        background: #059669;
        color: #fff;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <form>
      <h1>Get a Quote</h1>
      <fieldset>
        <legend>Personal</legend>
        <label class="t">Name</label>
        <input required />
        <label class="t">Email</label>
        <input type="email" required />
      </fieldset>
      <fieldset>
        <legend>Vehicle</legend>
        <label class="t">Registration (e.g. KA01AB1234)</label>
        <input
          required
          pattern="[A-Z]{2}[0-9]{2}[A-Z]{1,2}[0-9]{4}"
          title="Format: KA01AB1234"
          style="text-transform: uppercase"
        />
        <label class="t">Model</label>
        <input list="models" required />
        <datalist id="models">
          <option>Maruti Swift</option>
          <option>Hyundai Creta</option>
          <option>Tata Nexon</option>
          <option>Honda City</option>
        </datalist>
        <label class="t">Policy start date</label>
        <input type="date" required />
      </fieldset>
      <fieldset>
        <legend>Policy</legend>
        <div class="cards">
          <label>
            <input type="radio" name="p" required />
            Third-party
            <br />
            <b>Rs 2,500</b>
          </label>
          <label>
            <input type="radio" name="p" />
            Comprehensive
            <br />
            <b>Rs 8,000</b>
          </label>
          <label>
            <input type="radio" name="p" />
            Zero-dep
            <br />
            <b>Rs 12,000</b>
          </label>
        </div>
      </fieldset>
      <button>Get Quote</button>
    </form>
  </body>
</html>
