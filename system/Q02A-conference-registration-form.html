<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q2A - Tech Conference Registration</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        margin: 0;
        padding: 2rem 1rem;
        min-height: 100vh;
      }
      form {
        max-width: 560px;
        margin: auto;
        background: #fff;
        padding: 1.5rem 2rem;
        border-radius: 14px;
        box-shadow: 0 10px 30px #0003;
      }
      h1 {
        margin-top: 0;
        color: #4338ca;
      }
      fieldset {
        border: 1px solid #c7d2fe;
        border-radius: 10px;
        margin-bottom: 1rem;
      }
      legend {
        color: #4338ca;
        font-weight: 600;
        padding: 0 0.4rem;
      }
      label {
        display: block;
        margin: 0.6rem 0 0.2rem;
        font-size: 0.9rem;
        color: #374151;
      }
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid #6366f1;
        border-color: transparent;
      }
      input:invalid:not(:placeholder-shown) {
        border-color: #ef4444;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <form>
      <h1>Tech Conference 2026</h1>
      <fieldset>
        <legend>Personal Info</legend>
        <label>Full name</label>
        <input required placeholder=" " pattern="[A-Za-z ]{3,}" title="Letters only, min 3" />
        <label>Email</label>
        <input type="email" required placeholder=" " />
        <label>Phone (10 digits)</label>
        <input type="tel" required pattern="[0-9]{10}" placeholder=" " />
        <label>Website</label>
        <input type="url" placeholder=" " />
        <label>Date of birth</label>
        <input type="date" required />
      </fieldset>
      <fieldset>
        <legend>Conference Details</legend>
        <label>Track</label>
        <input list="tracks" required placeholder="Choose a track" />
        <datalist id="tracks">
          <option>Web Development</option>
          <option>AI / ML</option>
          <option>Cloud</option>
          <option>Cybersecurity</option>
        </datalist>
        <label>Number of tickets (1-5)</label>
        <input type="number" min="1" max="5" value="1" required />
        <label>
          Experience level:
          <output id="o">5</output>
          /10
        </label>
        <input type="range" min="0" max="10" value="5" oninput="o.value = this.value" />
      </fieldset>
      <button>Register</button>
    </form>
  </body>
</html>
