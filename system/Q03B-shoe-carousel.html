<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q3B - Shoe Carousel</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #111827;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        color: #fff;
      }
      .carousel {
        position: relative;
        width: 100%;
        max-width: 700px;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 12px 40px #0008;
      }
      .track {
        display: flex;
        transition: transform 0.6s ease;
      }
      .slide {
        min-width: 100%;
        position: relative;
      }
      .slide img {
        width: 100%;
        height: 380px;
        object-fit: cover;
        display: block;
      }
      .slide p {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0;
        padding: 1.5rem 1rem 1rem;
        background: linear-gradient(transparent, #000a);
        font-size: 1.3rem;
        font-weight: 600;
      }
      .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: #0007;
        color: #fff;
        font-size: 1.5rem;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
      }
      .nav:hover {
        background: #000b;
      }
      #prev {
        left: 12px;
      }
      #next {
        right: 12px;
      }
      .dots {
        position: absolute;
        bottom: 12px;
        right: 16px;
        display: flex;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff6;
        cursor: pointer;
        transition: 0.3s;
      }
      .dot.active {
        background: #fff;
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <div class="carousel" id="c">
      <div class="track" id="track">
        <div class="slide">
          <img src="https://picsum.photos/seed/shoe1/700/380" alt="" />
          <p>AirRunner - $120</p>
        </div>
        <div class="slide">
          <img src="https://picsum.photos/seed/shoe2/700/380" alt="" />
          <p>UrbanStep - $95</p>
        </div>
        <div class="slide">
          <img src="https://picsum.photos/seed/shoe3/700/380" alt="" />
          <p>TrailMax - $140</p>
        </div>
        <div class="slide">
          <img src="https://picsum.photos/seed/shoe4/700/380" alt="" />
          <p>CloudWalk - $110</p>
        </div>
      </div>
      <button class="nav" id="prev">&#10094;</button>
      <button class="nav" id="next">&#10095;</button>
      <div class="dots" id="dots"></div>
    </div>
    <script>
      const track = document.getElementById("track"),
        dots = document.getElementById("dots"),
        n = track.children.length;
      let i = 0,
        timer;
      for (let k = 0; k < n; k++) {
        const d = document.createElement("span");
        d.className = "dot";
        d.onclick = () => {
          go(k);
          restart();
        };
        dots.appendChild(d);
      }
      function go(k) {
        i = (k + n) % n;
        track.style.transform = `translateX(-${i * 100}%)`;
        [...dots.children].forEach((d, j) => d.classList.toggle("active", j == i));
      }
      function restart() {
        clearInterval(timer);
        timer = setInterval(() => go(i + 1), 3000);
      }
      document.getElementById("next").onclick = () => {
        go(i + 1);
        restart();
      };
      document.getElementById("prev").onclick = () => {
        go(i - 1);
        restart();
      };
      go(0);
      restart();
    </script>
  </body>
</html>
