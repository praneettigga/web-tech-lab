<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q2B - Learning Portal Auth</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #eef2ff;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        background: #312e81;
        color: #fff;
        padding: 0.9rem 2rem;
        flex-wrap: wrap;
      }
      nav .logo {
        font-weight: 700;
        font-size: 1.3rem;
        margin-right: auto;
      }
      nav a {
        color: #c7d2fe;
        text-decoration: none;
      }
      nav a:hover {
        color: #fff;
      }
      .btn {
        padding: 0.5rem 1.2rem;
        border-radius: 20px;
        border: 2px solid #818cf8;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 0.95rem;
        transition: 0.2s;
      }
      .btn:hover {
        background: #818cf8;
      }
      .btn.fill {
        background: #6366f1;
        border-color: #6366f1;
      }
      .btn.fill:hover {
        background: #4f46e5;
      }
      .card {
        max-width: 380px;
        margin: 3rem auto;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 10px 30px #0002;
        overflow: hidden;
      }
      .tabs {
        display: flex;
      }
      .tabs button {
        flex: 1;
        padding: 1rem;
        border: 0;
        background: #e0e7ff;
        cursor: pointer;
        font-weight: 600;
        color: #4338ca;
        transition: 0.2s;
      }
      .tabs button.active {
        background: #fff;
        border-bottom: 3px solid #6366f1;
      }
      form {
        display: none;
        padding: 1.5rem;
      }
      form.active {
        display: block;
      }
      input {
        width: 100%;
        padding: 0.7rem;
        margin-bottom: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
        transition: 0.2s;
      }
      input:hover {
        border-color: #a5b4fc;
      }
      input:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px #c7d2fe;
      }
      form .btn {
        width: 100%;
        color: #fff;
        background: #4f46e5;
        border-color: #4f46e5;
      }
      form .btn:hover {
        background: #3730a3;
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="logo">LearnHub</span>
      <a href="#">Courses</a>
      <a href="#">Mentors</a>
      <a href="#">Pricing</a>
      <button class="btn" onclick="show(0)">Sign In</button>
      <button class="btn fill" onclick="show(1)">Sign Up</button>
    </nav>
    <div class="card">
      <div class="tabs">
        <button class="active">Sign In</button>
        <button>Sign Up</button>
      </div>
      <form class="active">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button class="btn">Sign In</button>
      </form>
      <form>
        <input placeholder="Full name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" minlength="6" required />
        <button class="btn">Create Account</button>
      </form>
    </div>
    <script>
      const tabs = document.querySelectorAll(".tabs button"),
        forms = document.querySelectorAll("form");
      function show(i) {
        tabs.forEach((t, j) => t.classList.toggle("active", i == j));
        forms.forEach((f, j) => f.classList.toggle("active", i == j));
      }
      tabs.forEach((t, i) => (t.onclick = () => show(i)));
      forms.forEach((f) => (f.onsubmit = (e) => e.preventDefault()));
    </script>
  </body>
</html>
